#cloud-config

package_update: true
package_upgrade: true

packages:
  - nginx

runcmd:
  - systemctl enable nginx
  - systemctl start nginx

  - echo "<h1>Contoso Financial Services</h1>" > /var/www/html/index.html
  - echo "<h2>Enterprise Azure DevOps Lab</h2>" >> /var/www/html/index.html
  - echo "<p>Provisioned by Terraform + Cloud-init</p>" >> /var/www/html/index.html